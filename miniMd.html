<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MiniMd</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked-katex-extension@5.1.12/lib/index.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked-highlight@2/lib/index.umd.js"></script>
<link id="hljs-theme" rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/atom-one-light.min.css">
<style>
  :root {
    --bg: #ffffff;
    --fg: #1a1a1a;
    --panel-bg: #ffffff;
    --border: #d0d0d0;
    --toolbar-bg: #f3f3f3;
    --editor-bg: #ffffff;
    --editor-fg: #1a1a1a;
    --code-bg: #f0f0f0;
    --link: #0969da;
    --scrollbar: #c0c0c0;
    --h1-color: var(--fg);
    --h2-color: var(--fg);
    --h3-color: var(--fg);
    --h4-color: var(--fg);
    --h5-color: var(--fg);
    --h6-color: var(--fg);
  }

  html[data-theme="dark"] {
    --bg: #1e1e1e;
    --fg: #e0e0e0;
    --panel-bg: #1e1e1e;
    --border: #3a3a3a;
    --toolbar-bg: #252525;
    --editor-bg: #1e1e1e;
    --editor-fg: #e0e0e0;
    --code-bg: #2d2d2d;
    --link: #58a6ff;
    --scrollbar: #4a4a4a;
  }

  html[data-theme="atom"],
  html[data-theme="atom-color"],
  html[data-theme="atom-color1"] {
    --bg: #282c34;
    --fg: #abb2bf;
    --panel-bg: #282c34;
    --border: #21252b;
    --toolbar-bg: #21252b;
    --editor-bg: #282c34;
    --editor-fg: #abb2bf;
    --code-bg: #2c313c;
    --link: #61afef;
    --scrollbar: #3e4451;
  }

  html[data-theme="atom-color"] {
    --h1-color: #e06c75;
    --h2-color: #d19a66;
    --h3-color: #e5c07b;
    --h4-color: #98c379;
    --h5-color: #56b6c2;
    --h6-color: #61afef;
  }

  html[data-theme="atom-color1"] {
    --h1-color: #2b6fce;
    --h2-color: #3b82e0;
    --h3-color: #4e94ea;
    --h4-color: #61afef;
    --h5-color: #7ec0f4;
    --h6-color: #9ad0f7;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  #toolbar {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 8px 16px;
    background: var(--toolbar-bg);
    border-top: 1px solid var(--border);
    height: 48px;
    flex-wrap: wrap;
  }

  #toolbar h1 {
    font-size: 16px;
    font-weight: 600;
    margin: 0;
    margin-right: auto;
  }

  #tabbar {
    display: flex;
    align-items: center;
    background: var(--toolbar-bg);
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
    overflow-y: hidden;
  }

  #tabs {
    display: flex;
    align-items: stretch;
  }

  .tab {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    font-size: 13px;
    color: var(--fg);
    border-right: 1px solid var(--border);
    cursor: pointer;
    white-space: nowrap;
    opacity: 0.65;
  }

  .tab.active {
    opacity: 1;
    background: var(--bg);
    box-shadow: inset 0 -2px 0 var(--link);
  }

  .tab-mode-badge {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.02em;
    padding: 1px 5px;
    border-radius: 3px;
    background: var(--code-bg);
    opacity: 0.8;
  }

  .tab-title {
    outline: none;
    max-width: 160px;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .tab-title[contenteditable="true"] {
    overflow: visible;
    text-overflow: clip;
    cursor: text;
  }

  .tab-close {
    font-size: 14px;
    line-height: 1;
    opacity: 0.6;
    padding: 0 2px;
    border-radius: 3px;
  }

  .tab-close:hover {
    opacity: 1;
    background: var(--code-bg);
  }

  #new-tab-btn {
    background: none;
    color: var(--fg);
    border: none;
    padding: 8px 14px;
    font-size: 16px;
    cursor: pointer;
    opacity: 0.7;
    flex-shrink: 0;
  }

  #new-tab-btn:hover {
    opacity: 1;
  }

  .control {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
  }

  .control label {
    color: var(--fg);
    opacity: 0.8;
  }

  .control select,
  .control button {
    background: var(--editor-bg);
    color: var(--fg);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 4px 8px;
    font-size: 13px;
    cursor: pointer;
  }

  .control select:disabled,
  .control button:disabled {
    opacity: 0.4;
    cursor: default;
  }

  #container {
    display: flex;
    height: calc(100% - 48px - 37px);
  }

  #editor-pane, #preview-pane {
    width: 50%;
    height: 100%;
  }

  #editor-pane {
    border-right: 1px solid var(--border);
    overflow: hidden;
  }

  #editor {
    width: 100%;
    height: 100%;
    resize: none;
    border: none;
    outline: none;
    padding: 16px;
    background: var(--editor-bg);
    color: var(--editor-fg);
    font-family: "SF Mono", Monaco, Consolas, "Courier New", monospace;
    line-height: 1.5;
  }

  #preview-pane {
    background: var(--panel-bg);
    display: flex;
    flex-direction: column;
  }

  /* --- Markdown preview mode --- */
  #markdown-view {
    flex: 1;
    min-height: 0;
    overflow: auto;
  }

  #preview {
    padding: 16px 24px;
    line-height: 1.6;
    word-wrap: break-word;
  }

  #preview a {
    color: var(--link);
  }

  #preview h1 { color: var(--h1-color); }
  #preview h2 { color: var(--h2-color); }
  #preview h3 { color: var(--h3-color); }
  #preview h4 { color: var(--h4-color); }
  #preview h5 { color: var(--h5-color); }
  #preview h6 { color: var(--h6-color); }

  #preview code {
    background: var(--code-bg);
    padding: 2px 5px;
    border-radius: 3px;
    font-family: "SF Mono", Monaco, Consolas, "Courier New", monospace;
  }

  #preview pre {
    background: var(--code-bg);
    padding: 12px;
    border-radius: 6px;
    overflow-x: auto;
  }

  #preview pre code {
    background: none;
    padding: 0;
  }

  #preview blockquote {
    border-left: 4px solid var(--border);
    margin: 0;
    padding-left: 16px;
    opacity: 0.85;
  }

  #preview table {
    border-collapse: collapse;
  }

  #preview th, #preview td {
    border: 1px solid var(--border);
    padding: 6px 10px;
  }

  #preview img {
    max-width: 100%;
  }

  #preview hr {
    border: none;
    border-top: 1px solid var(--border);
  }

  /* --- Marp slide mode --- */
  #marp-view {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }

  #slide-viewport {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    min-height: 0;
    background: var(--panel-bg);
  }

  #slide-viewport:fullscreen {
    background: #000;
    padding: 0;
  }

  #slide-stage {
    width: 100%;
    max-width: 100%;
    box-shadow: 0 0 0 1px var(--border), 0 4px 16px rgba(0, 0, 0, 0.15);
  }

  #slide-stage .marpit svg[data-marpit-svg] {
    display: none;
    width: 100%;
    height: auto;
    vertical-align: top;
  }

  #slide-stage .marpit svg[data-marpit-svg].current-slide {
    display: block;
  }

  #slide-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 10px;
    border-top: 1px solid var(--border);
    font-size: 13px;
    flex-shrink: 0;
  }

  #slide-nav button {
    background: var(--editor-bg);
    color: var(--fg);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 4px 10px;
    font-size: 13px;
    cursor: pointer;
  }

  #slide-nav button:disabled {
    opacity: 0.4;
    cursor: default;
  }

  #slide-counter {
    min-width: 60px;
    text-align: center;
    opacity: 0.8;
  }

  /* --- scrollbars --- */
  #editor,
  #markdown-view {
    scrollbar-color: var(--scrollbar) var(--panel-bg);
  }
  #editor::-webkit-scrollbar,
  #markdown-view::-webkit-scrollbar {
    width: 10px;
  }
  #editor::-webkit-scrollbar-track,
  #markdown-view::-webkit-scrollbar-track {
    background: var(--panel-bg);
  }
  #editor::-webkit-scrollbar-thumb,
  #markdown-view::-webkit-scrollbar-thumb {
    background: var(--scrollbar);
    border-radius: 5px;
  }

  @media (max-width: 700px) {
    #container {
      flex-direction: column;
    }
    #editor-pane, #preview-pane {
      width: 100%;
      height: 50%;
    }
    #editor-pane {
      border-right: none;
      border-bottom: 1px solid var(--border);
    }
    #toolbar {
      height: auto;
    }
  }
</style>
</head>
<body>

<div id="tabbar">
  <div id="tabs"></div>
  <button id="new-tab-btn" title="New tab">+</button>
</div>

<div id="container">
  <div id="editor-pane">
    <textarea id="editor" spellcheck="false" placeholder="Type your markdown here..."></textarea>
  </div>
  <div id="preview-pane">
    <div id="markdown-view">
      <div id="preview"></div>
    </div>
    <div id="marp-view" style="display: none;">
      <div id="slide-viewport">
        <div id="slide-stage"></div>
      </div>
      <div id="slide-nav">
        <button id="prev-slide-btn" title="Previous slide">&larr; Prev</button>
        <span id="slide-counter">0 / 0</span>
        <button id="next-slide-btn" title="Next slide">Next &rarr;</button>
        <button id="present-btn" title="Present fullscreen">Present</button>
      </div>
    </div>
  </div>
</div>

<div id="toolbar">
  <h1>MiniMd</h1>

  <div class="control">
    <label for="mode-select">Mode</label>
    <select id="mode-select">
      <option value="markdown">Markdown</option>
      <option value="marp">Marp</option>
    </select>
  </div>

  <div class="control">
    <label for="theme-select">Theme</label>
    <select id="theme-select">
      <option value="light">Light</option>
      <option value="dark">Dark</option>
      <option value="atom">Atom</option>
      <option value="atom-color">Atom Color</option>
      <option value="atom-color1">Atom Color1</option>
    </select>
  </div>

  <div class="control">
    <label for="slide-theme-select">Slide theme</label>
    <select id="slide-theme-select" disabled>
      <option value="default">Default</option>
      <option value="gaia">Gaia</option>
      <option value="uncover">Uncover</option>
    </select>
  </div>

  <div class="control">
    <label for="font-size-select">Font size</label>
    <select id="font-size-select">
      <option value="12">12px</option>
      <option value="14">14px</option>
      <option value="16">16px</option>
      <option value="18">18px</option>
      <option value="20">20px</option>
      <option value="24">24px</option>
    </select>
  </div>

  <div class="control">
    <button id="download-btn" title="Download all tabs as a zip of .md files">Download</button>
  </div>

  <div class="control">
    <button id="clear-btn" title="Clear the current tab">Clear</button>
  </div>
</div>

<script type="module">
  import { Marp } from 'https://esm.sh/@marp-team/marp-core@4.4.0?bundle';
  import applyBrowserHelper from 'https://esm.sh/@marp-team/marp-core@4.4.0/browser?bundle';

  const STORAGE_KEYS = {
    legacyContent: 'md-editor-content',
    tabs: 'minimd-tabs',
    activeTab: 'minimd-active-tab',
    theme: 'minimd-theme',
    fontSize: 'minimd-font-size',
  };

  const editor = document.getElementById('editor');
  const preview = document.getElementById('preview');
  const previewPane = document.getElementById('preview-pane');
  const markdownView = document.getElementById('markdown-view');
  const marpView = document.getElementById('marp-view');
  const slideStage = document.getElementById('slide-stage');
  const slideViewport = document.getElementById('slide-viewport');
  const themeSelect = document.getElementById('theme-select');
  const modeSelect = document.getElementById('mode-select');
  const slideThemeSelect = document.getElementById('slide-theme-select');
  const fontSizeSelect = document.getElementById('font-size-select');
  const clearBtn = document.getElementById('clear-btn');
  const downloadBtn = document.getElementById('download-btn');
  const tabsEl = document.getElementById('tabs');
  const newTabBtn = document.getElementById('new-tab-btn');
  const prevSlideBtn = document.getElementById('prev-slide-btn');
  const nextSlideBtn = document.getElementById('next-slide-btn');
  const slideCounter = document.getElementById('slide-counter');
  const presentBtn = document.getElementById('present-btn');

  const DEFAULT_CONTENT = '# Welcome\n\nStart typing **Markdown** on the left, see it rendered on the right.\n';

  const DEFAULT_MARP_CONTENT = [
    '---',
    'marp: true',
    'theme: default',
    'paginate: true',
    '---',
    '',
    '# Welcome to MiniMd',
    '',
    'Edit this Markdown to build your slide deck.',
    '',
    'Use `---` on its own line to start a new slide.',
    '',
    '---',
    '',
    '## Second slide',
    '',
    '- Bullet one',
    '- Bullet two',
    '- Math works too: $E = mc^2$',
    '',
  ].join('\n');

  marked.use(markedKatex({ throwOnError: false }));
  marked.use(markedHighlight.markedHighlight({
    langPrefix: 'hljs language-',
    highlight(code, lang) {
      const language = hljs.getLanguage(lang) ? lang : 'plaintext';
      return hljs.highlight(code, { language }).value;
    },
  }));

  const marp = new Marp({ math: 'katex', script: false });

  const HLJS_THEMES = {
    light: 'atom-one-light',
    dark: 'atom-one-dark',
    atom: 'atom-one-dark',
    'atom-color': 'atom-one-dark',
    'atom-color1': 'atom-one-dark',
  };
  const hljsThemeLink = document.getElementById('hljs-theme');

  function applyHljsTheme(theme) {
    const name = HLJS_THEMES[theme] || 'atom-one-light';
    hljsThemeLink.href = 'https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/' + name + '.min.css';
  }

  let tabs = [];
  let activeTabId = null;

  function makeTabId() {
    return 'tab-' + Math.random().toString(36).slice(2, 10);
  }

  function saveTabs() {
    localStorage.setItem(STORAGE_KEYS.tabs, JSON.stringify(tabs));
    localStorage.setItem(STORAGE_KEYS.activeTab, activeTabId);
  }

  function getActiveTab() {
    return tabs.find(function (t) { return t.id === activeTabId; });
  }

  function renderMarkdown() {
    const raw = marked.parse(editor.value);
    preview.innerHTML = DOMPurify.sanitize(raw, {
      USE_PROFILES: { html: true, svg: true, mathMl: true },
    });
  }

  function upsertFrontMatterTheme(content, themeName) {
    const fmMatch = content.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n?/);
    if (fmMatch) {
      let body = fmMatch[1];
      if (/^theme:.*$/m.test(body)) {
        body = body.replace(/^theme:.*$/m, 'theme: ' + themeName);
      } else {
        body = body + '\ntheme: ' + themeName;
      }
      if (!/^marp:\s*true\s*$/m.test(body)) {
        body = 'marp: true\n' + body;
      }
      return content.slice(0, fmMatch.index) + '---\n' + body + '\n---\n' + content.slice(fmMatch[0].length);
    }
    return '---\nmarp: true\ntheme: ' + themeName + '\n---\n\n' + content;
  }

  function detectFrontMatterTheme(content) {
    const fmMatch = content.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n?/);
    if (fmMatch) {
      const m = fmMatch[1].match(/^theme:\s*(\S+)\s*$/m);
      if (m) return m[1];
    }
    return 'default';
  }

  function isDarkAppTheme(theme) {
    return theme === 'dark' || theme.indexOf('atom') === 0;
  }

  function applyInvertToSlideStage() {
    const shouldInvert = isDarkAppTheme(document.documentElement.getAttribute('data-theme') || 'light');
    slideStage.querySelectorAll('section').forEach(function (section) {
      section.classList.toggle('invert', shouldInvert);
    });
  }

  function renderSlides() {
    const tab = getActiveTab();
    let html = '';
    let css = '';
    try {
      const result = marp.render(editor.value);
      html = result.html;
      css = result.css;
    } catch (e) {
      slideStage.innerHTML = '<div style="opacity:0.6;font-size:14px;">Render error: ' + String(e.message || e) + '</div>';
      slideCounter.textContent = '0 / 0';
      prevSlideBtn.disabled = true;
      nextSlideBtn.disabled = true;
      return;
    }

    slideStage.innerHTML = '<style>' + css + '</style>' + html;
    applyBrowserHelper(slideStage);
    applyInvertToSlideStage();

    const svgs = slideStage.querySelectorAll('svg[data-marpit-svg]');
    const slideCount = svgs.length;

    if (!slideCount) {
      slideCounter.textContent = '0 / 0';
      prevSlideBtn.disabled = true;
      nextSlideBtn.disabled = true;
      return;
    }

    if (tab) {
      if (typeof tab.slideIndex !== 'number' || tab.slideIndex < 0 || tab.slideIndex >= slideCount) {
        tab.slideIndex = 0;
      }
    }
    const currentIndex = tab ? tab.slideIndex : 0;

    svgs.forEach(function (svg, i) {
      svg.classList.toggle('current-slide', i === currentIndex);
    });

    slideCounter.textContent = (currentIndex + 1) + ' / ' + slideCount;
    prevSlideBtn.disabled = currentIndex <= 0;
    nextSlideBtn.disabled = currentIndex >= slideCount - 1;

    const slideThemeInContent = detectFrontMatterTheme(editor.value);
    if (slideThemeSelect.value !== slideThemeInContent && ['default', 'gaia', 'uncover'].includes(slideThemeInContent)) {
      slideThemeSelect.value = slideThemeInContent;
    }
  }

  function renderActive() {
    const tab = getActiveTab();
    const mode = tab ? tab.mode : 'markdown';
    if (mode === 'marp') {
      renderSlides();
    } else {
      renderMarkdown();
    }
  }

  function goToSlide(delta) {
    const tab = getActiveTab();
    if (!tab || tab.mode !== 'marp') return;
    const svgs = slideStage.querySelectorAll('svg[data-marpit-svg]');
    if (!svgs.length) return;
    const newIndex = Math.max(0, Math.min(svgs.length - 1, (tab.slideIndex || 0) + delta));
    if (newIndex === tab.slideIndex) return;
    tab.slideIndex = newIndex;
    saveTabs();
    renderSlides();
  }

  function applyModeUI(mode) {
    modeSelect.value = mode;
    const isMarp = mode === 'marp';
    markdownView.style.display = isMarp ? 'none' : '';
    marpView.style.display = isMarp ? 'flex' : 'none';
    slideThemeSelect.disabled = !isMarp;
  }

  function renderTabs() {
    tabsEl.innerHTML = '';
    tabs.forEach(function (tab) {
      const tabEl = document.createElement('div');
      tabEl.className = 'tab' + (tab.id === activeTabId ? ' active' : '');
      tabEl.dataset.tabId = tab.id;

      const badgeEl = document.createElement('span');
      badgeEl.className = 'tab-mode-badge';
      badgeEl.textContent = tab.mode === 'marp' ? 'MARP' : 'MD';

      const titleEl = document.createElement('span');
      titleEl.className = 'tab-title';
      titleEl.textContent = tab.title;
      titleEl.title = tab.title;
      titleEl.addEventListener('click', function () {
        if (tab.id !== activeTabId) switchTab(tab.id);
      });
      titleEl.addEventListener('dblclick', function (e) {
        e.stopPropagation();
        titleEl.setAttribute('contenteditable', 'true');
        titleEl.focus();
        document.execCommand('selectAll', false, null);
      });
      titleEl.addEventListener('blur', function () {
        titleEl.removeAttribute('contenteditable');
        const newTitle = titleEl.textContent.trim() || 'Untitled';
        tab.title = newTitle;
        titleEl.textContent = newTitle;
        titleEl.title = newTitle;
        saveTabs();
      });
      titleEl.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          titleEl.blur();
        } else if (e.key === 'Escape') {
          titleEl.textContent = tab.title;
          titleEl.blur();
        }
      });

      const closeEl = document.createElement('span');
      closeEl.className = 'tab-close';
      closeEl.textContent = '×';
      closeEl.title = 'Close tab';
      closeEl.addEventListener('click', function (e) {
        e.stopPropagation();
        closeTab(tab.id);
      });

      tabEl.appendChild(badgeEl);
      tabEl.appendChild(titleEl);
      if (tabs.length > 1) tabEl.appendChild(closeEl);
      tabsEl.appendChild(tabEl);
    });
  }

  function switchTab(id) {
    saveActiveTabContent();
    activeTabId = id;
    const tab = getActiveTab();
    editor.value = tab.content;
    applyModeUI(tab.mode);
    saveTabs();
    renderTabs();
    renderActive();
    editor.focus();
  }

  function saveActiveTabContent() {
    const tab = getActiveTab();
    if (tab) tab.content = editor.value;
  }

  function newTab() {
    saveActiveTabContent();
    const tab = { id: makeTabId(), title: 'Untitled', content: '', mode: 'markdown', slideIndex: 0 };
    tabs.push(tab);
    activeTabId = tab.id;
    editor.value = '';
    applyModeUI(tab.mode);
    saveTabs();
    renderTabs();
    renderActive();
    editor.focus();
  }

  function closeTab(id) {
    if (tabs.length <= 1) return;
    const idx = tabs.findIndex(function (t) { return t.id === id; });
    if (idx === -1) return;
    tabs.splice(idx, 1);
    if (activeTabId === id) {
      const nextIdx = Math.max(0, idx - 1);
      activeTabId = tabs[nextIdx].id;
      const tab = getActiveTab();
      editor.value = tab.content;
      applyModeUI(tab.mode);
      renderActive();
    }
    saveTabs();
    renderTabs();
  }

  function sanitizeFilename(name) {
    return name.trim().replace(/[\\/:*?"<>|]/g, '-') || 'Untitled';
  }

  function downloadAllTabs() {
    saveActiveTabContent();

    const zip = new JSZip();
    const usedNames = new Set();

    tabs.forEach(function (tab) {
      const base = sanitizeFilename(tab.title);
      let name = base + '.md';
      let n = 2;
      while (usedNames.has(name)) {
        name = base + ' (' + n + ').md';
        n++;
      }
      usedNames.add(name);
      zip.file(name, tab.content);
    });

    zip.generateAsync({ type: 'blob' }).then(function (blob) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'minimd-notes.zip';
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    });
  }

  function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    themeSelect.value = theme;
    localStorage.setItem(STORAGE_KEYS.theme, theme);
    applyHljsTheme(theme);
    applyInvertToSlideStage();
  }

  function applyFontSize(size) {
    editor.style.fontSize = size + 'px';
    preview.style.fontSize = size + 'px';
    fontSizeSelect.value = size;
    localStorage.setItem(STORAGE_KEYS.fontSize, size);
  }

  function loadInitialState() {
    const savedTabsRaw = localStorage.getItem(STORAGE_KEYS.tabs);
    if (savedTabsRaw) {
      try {
        tabs = JSON.parse(savedTabsRaw);
      } catch (e) {
        tabs = [];
      }
    }

    if (tabs && tabs.length) {
      tabs.forEach(function (t) {
        if (t.mode !== 'marp') t.mode = 'markdown';
        if (typeof t.slideIndex !== 'number') t.slideIndex = 0;
      });
    }

    if (!tabs || !tabs.length) {
      const legacyContent = localStorage.getItem(STORAGE_KEYS.legacyContent);
      tabs = [{
        id: makeTabId(),
        title: 'Untitled',
        content: legacyContent !== null ? legacyContent : DEFAULT_CONTENT,
        mode: 'markdown',
        slideIndex: 0,
      }];
    }

    const savedActiveId = localStorage.getItem(STORAGE_KEYS.activeTab);
    activeTabId = tabs.some(function (t) { return t.id === savedActiveId; }) ? savedActiveId : tabs[0].id;

    const activeTab = getActiveTab();
    editor.value = activeTab.content;
    applyModeUI(activeTab.mode);
    saveTabs();
    renderTabs();

    const savedTheme = localStorage.getItem(STORAGE_KEYS.theme) || 'light';
    applyTheme(savedTheme);

    const savedFontSize = localStorage.getItem(STORAGE_KEYS.fontSize) || '14';
    applyFontSize(savedFontSize);

    renderActive();
  }

  function syncScroll(source, target) {
    const sourceScrollable = source.scrollHeight - source.clientHeight;
    const targetScrollable = target.scrollHeight - target.clientHeight;
    if (sourceScrollable <= 0) return;
    const ratio = source.scrollTop / sourceScrollable;
    target.scrollTop = ratio * targetScrollable;
  }

  let syncingScroll = false;

  editor.addEventListener('input', function () {
    saveActiveTabContent();
    saveTabs();
    renderActive();
  });

  editor.addEventListener('scroll', function () {
    const tab = getActiveTab();
    if (!tab || tab.mode !== 'markdown') return;
    if (syncingScroll) { syncingScroll = false; return; }
    syncingScroll = true;
    syncScroll(editor, markdownView);
  });

  markdownView.addEventListener('scroll', function () {
    const tab = getActiveTab();
    if (!tab || tab.mode !== 'markdown') return;
    if (syncingScroll) { syncingScroll = false; return; }
    syncingScroll = true;
    syncScroll(markdownView, editor);
  });

  themeSelect.addEventListener('change', function () {
    applyTheme(themeSelect.value);
  });

  modeSelect.addEventListener('change', function () {
    const tab = getActiveTab();
    if (!tab) return;
    const newMode = modeSelect.value;
    if (newMode === tab.mode) return;
    tab.mode = newMode;
    if (newMode === 'marp' && !editor.value.trim()) {
      editor.value = DEFAULT_MARP_CONTENT;
      tab.content = editor.value;
    }
    applyModeUI(newMode);
    saveTabs();
    renderTabs();
    renderActive();
  });

  slideThemeSelect.addEventListener('change', function () {
    editor.value = upsertFrontMatterTheme(editor.value, slideThemeSelect.value);
    saveActiveTabContent();
    saveTabs();
    renderActive();
  });

  fontSizeSelect.addEventListener('change', function () {
    applyFontSize(fontSizeSelect.value);
  });

  clearBtn.addEventListener('click', function () {
    if (confirm('Clear the current tab? This cannot be undone.')) {
      editor.value = '';
      saveActiveTabContent();
      const tab = getActiveTab();
      if (tab) tab.slideIndex = 0;
      saveTabs();
      renderActive();
      editor.focus();
    }
  });

  newTabBtn.addEventListener('click', newTab);
  downloadBtn.addEventListener('click', downloadAllTabs);
  prevSlideBtn.addEventListener('click', function () { goToSlide(-1); });
  nextSlideBtn.addEventListener('click', function () { goToSlide(1); });

  presentBtn.addEventListener('click', function () {
    if (slideViewport.requestFullscreen) {
      slideViewport.requestFullscreen();
    }
  });

  document.addEventListener('keydown', function (e) {
    if (document.activeElement === editor) return;
    const tab = getActiveTab();
    if (!tab || tab.mode !== 'marp') return;
    if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') {
      e.preventDefault();
      goToSlide(1);
    } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
      e.preventDefault();
      goToSlide(-1);
    }
  });

  loadInitialState();
</script>

</body>
</html>
